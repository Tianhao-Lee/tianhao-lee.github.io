linkLabel = "实验室主页"
content = """
**朱敏**，教授、博士生导师，视觉计算实验室创立者兼负责人。

#### 任职与学历

- 现任四川大学卓越工程师学院副院长；曾任计算机学院副院长、党委副书记
- 2004 年博士毕业于四川大学应用数学专业
- 2013–2014 年美国凯斯西储大学访问学者（国家留学基金委资助）
- 研究方向：视觉计算、可视分析与人机交互、生物信息学

#### 主持项目

- 国家自然科学基金面上项目「面向疾病-调控因子的异构图可视分析研究」（2021–2025）
- 国家重点研发计划「交通基础设施专项」课题「机场『环-物-人』重大运行安全风险源综合监测与预警防范技术研究及应用验证」（2023–2026）
- 科技部中央引导地方科技发展专项「基于多模态数据的农业大数据可视化平台」（2021–2024）
- 成都市科技局重点研发支撑计划「矿山资源开发生产大模型关键技术及应用」（2025–2028）
- 成都市科技局重点研发支撑计划「基于遥感图像的绿色基础设施变化检测方法及可视分析研究」（2023–2025）
- 东方电气、科研院所等企业合作项目

#### 荣誉与兼职

- 宝钢优秀教师、四川省学术和技术带头人、四川省有突出贡献优秀专家
- 四川省三八红旗手、四川省教学名师、四川省海外高层次留学人才、成都「蓉城英才计划」教育领军人才
- 省部级科技进步奖 2 项；国家级教学成果一等奖 1 项，省级教学成果特等奖/一等奖/二等奖 7 项
- 中国计算机学会杰出会员；中国图象图形学学会可视化与可视分析专业委员会常务委员
- 四川省人工智能学会理事；四川省首批人工智能标准化技术委员会委员

#### 人才培养

- 截至 2026 年 7 月，已培养硕博士研究生 123 人
- 获四川大学第八届「德沃群芳育人文化建设标兵团队」、2025 年度四川大学「百佳学生集体」
- 近年在 CVPR、AAAI、ECCV、ICASSP、ICME 及 Medical Image Analysis 等会议与期刊发表成果
"""

