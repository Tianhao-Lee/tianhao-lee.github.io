- Ph.D. in Applied Mathematics, Sichuan University (2004)
- Visiting scholar, Case Western Reserve University (2013–2014, CSC-funded)
- Research: visual computing, visual analytics and human-computer interaction, bioinformatics

#### Selected projects

- Heterogeneous graph visual analytics for disease–regulatory factor association — NSFC General Program (2021–2025)
- Monitoring and early warning of major operational safety risk sources at airports — National Key R&D Program, Transportation Infrastructure (2023–2026)
- Multimodal agricultural big-data visualization platform — MOST Central Guidance Fund for Local Science and Technology Development (2021–2024)
- Large models for mining resource development and production — Chengdu Key R&D Support Program (2025–2028)
- Green infrastructure change detection and visual analytics from remote sensing imagery — Chengdu Key R&D Support Program (2023–2025)
- Industry and research-institute collaborations including Dongfang Electric

#### Honors and service

- Baosteel Outstanding Teacher; Sichuan Academic and Technical Leader; Sichuan Provincial Expert with Outstanding Contributions
- Sichuan March 8th Red Banner Pacesetter; Sichuan Provincial Teaching Master; Sichuan Overseas High-Level Talent; Chengdu "Rongcheng Talent Plan" Education Leader
- Two provincial/ministerial Science and Technology Progress Awards; one national first prize and seven provincial awards for teaching achievement
- CCF Distinguished Member; standing committee member of the CSIG Technical Committee on Visualization and Visual Analytics
- Council member, Sichuan Association for Artificial Intelligence; member, Sichuan inaugural AI Standardization Technical Committee

#### Graduate training

- 123 master's and doctoral students trained as of July 2026
- Sichuan University "Dewo Qunfang" model team for educational culture; Top 100 Student Collective, 2025
